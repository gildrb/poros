[package]
name = "poros"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Expose local development servers privately over Tailscale"
license = "MIT"

[dependencies]
libc = "0.2.174"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.release]
lto = true
codegen-units = 1
strip = true
