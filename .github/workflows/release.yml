name: Release

# Tag porthmeus-v<version> (the version in Cargo.toml) to release. The release
# stays a draft until every archive, SHA256SUMS and install.sh are attached, so
# releases/latest never points at a release with missing assets.
on:
  push:
    tags: ["porthmeus-v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version="${GITHUB_REF_NAME#porthmeus-v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --title "Porthmeus v${{ steps.version.outputs.version }}"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          # macos-13 was retired; this is Actions' last x86_64 macOS image.
          - os: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked
      - name: Package
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp target/release/porthmeus "$stage/"
          ln -s porthmeus "$stage/p"
          reported="$("$stage/porthmeus" --version)"
          if [ "$reported" != "$VERSION" ]; then
            echo "binary reports $reported, expected $VERSION" >&2
            exit 1
          fi
          archive="porthmeus-${VERSION}-${{ matrix.platform }}.tar.gz"
          tar -czf "$archive" -C "$stage" porthmeus p
          gh release upload "$GITHUB_REF_NAME" "$archive" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          mkdir dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'porthmeus-*.tar.gz' --dir dist
          count="$(find dist -name 'porthmeus-*.tar.gz' | wc -l)"
          if [ "$count" -ne 4 ]; then
            echo "expected 4 archives, found $count" >&2
            exit 1
          fi
          (cd dist && sha256sum porthmeus-*.tar.gz > SHA256SUMS)
          cp install.sh dist/
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS dist/install.sh \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
