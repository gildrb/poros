name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      POROS_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: |
          mkdir -p dist
          cp target/release/poros dist/
          tar -czf "poros-${{ matrix.target }}.tar.gz" -C dist poros
          sha256sum "poros-${{ matrix.target }}.tar.gz" > "poros-${{ matrix.target }}.tar.gz.sha256"
      - run: |
          gh release upload "$GITHUB_REF_NAME" \
            "poros-${{ matrix.target }}.tar.gz" \
            "poros-${{ matrix.target }}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
